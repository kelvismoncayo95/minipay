services:
  postgres:
    image: postgres:17
    container_name: minipay-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-minipay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minipay_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-minipay}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-minipay} -d ${POSTGRES_DB:-minipay}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: minipay-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: minipay-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-minipay}:${POSTGRES_PASSWORD:-minipay_dev_password}@postgres:5432/${POSTGRES_DB:-minipay}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app

volumes:
  postgres_data:
  redis_data:
